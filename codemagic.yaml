workflows:
  ios-release:
    name: Grateful Prints iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        # Create this group in Codemagic (app > Environment variables) and put the
        # three App Store Connect API key values in it, all marked Secure:
        #   APP_STORE_CONNECT_ISSUER_ID
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #   APP_STORE_CONNECT_PRIVATE_KEY
        - ios_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.gratefulprints.app"
        APP_STORE_APPLE_ID: "6785534702"
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  ios-verify:
    name: Grateful Prints iOS Verify (build + sign, NO publishing)
    # Purpose: prove the current main tree compiles, signs and archives cleanly on a
    # current Apple toolchain. Deliberately has NO `publishing:` block, so it never
    # uploads to TestFlight or the App Store and never consumes an Apple build number.
    # The canonical release pipeline remains `ios-release` above - do not merge the two.
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - ios_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.gratefulprints.app"
    scripts:
      - name: Report toolchain
        script: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
      - name: Install Node dependencies
        script: |
          npm install
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Assert no Apple Sign-In native capability regressed in
        script: |
          if ls ios/App/App/*.entitlements >/dev/null 2>&1; then
            echo "FAIL: an entitlements file is present; Apple Sign-In native capability may have returned"; exit 1
          fi
          if grep -q "apple-sign-in" package.json; then
            echo "FAIL: apple-sign-in dependency is back in package.json"; exit 1
          fi
          echo "OK: no entitlements file, no apple-sign-in dependency"
      - name: Assert production host and compliance user agent
        script: |
          grep -q "https://app.gratefulprintsph.com" capacitor.config.json || { echo "FAIL: production host missing"; exit 1; }
          grep -q "GratefulPrintsIOSApp" capacitor.config.json || { echo "FAIL: compliance user agent missing"; exit 1; }
          grep -qE "localhost|ngrok|replit.app|staging" capacitor.config.json && { echo "FAIL: non-production host present"; exit 1; }
          echo "OK: production host and compliance user agent intact"
      - name: Set verification build number
        script: |
          cd ios/App
          agvtool new-version -all 999
      - name: Build and sign iOS
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
